<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    >

    <meta
        name="theme-color"
        content="#111111"
    >

    <title>My Character AI ✨</title>

    <style>

        /* =====================================================
           RESET
        ===================================================== */

        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            padding: 0;

            width: 100%;
            height: 100%;

            overflow: hidden;

            font-family:
                Arial,
                Helvetica,
                sans-serif;

            background: #111;
            color: white;
        }


        body {
            display: flex;
            flex-direction: column;
        }


        button,
        input,
        textarea,
        select {
            font-family: inherit;
        }


        button {
            cursor: pointer;
            -webkit-tap-highlight-color: transparent;
        }


        /* =====================================================
           HEADER
        ===================================================== */

        .header {

            flex: 0 0 auto;

            min-height: 68px;

            padding:
                10px 14px;

            background:
                rgba(25, 25, 25, 0.97);

            border-bottom:
                1px solid #333;

            display: flex;

            align-items: center;

            gap: 8px;

            z-index: 20;
        }


        .title {

            font-size: 21px;

            font-weight: bold;

            margin-right: auto;

            white-space: nowrap;
        }


        .title span {

            font-size: 12px;

            font-weight: normal;

            color: #aaa;

            margin-left: 5px;
        }


        select {

            min-width: 120px;

            max-width: 155px;

            padding:
                10px;

            border: none;

            border-radius: 10px;

            font-size: 14px;

            background: white;

            color: black;

            outline: none;
        }


        .header button {

            border: none;

            border-radius: 10px;

            padding:
                10px 13px;

            font-size: 14px;

            font-weight: 600;

            background: #fff;

            color: #111;

            transition:
                transform 0.15s ease,
                opacity 0.15s ease;
        }


        .header button:hover {

            opacity: 0.85;

            transform: translateY(-1px);
        }


        .header button:active {

            transform: scale(0.96);
        }


        /* =====================================================
           CHAT
        ===================================================== */

        .chat {

            position: relative;

            flex: 1 1 auto;

            min-height: 0;

            width: 100%;

            padding:
                20px 18px 100px;

            overflow-y: auto;

            overflow-x: hidden;

            background-color: #151515;

            background-repeat: no-repeat;

            background-position: center;

            background-size: cover;

            -webkit-overflow-scrolling: touch;

            scroll-behavior: smooth;
        }


        .chat::before {

            content: "";

            position: fixed;

            top: 68px;

            left: 0;

            right: 0;

            bottom: 0;

            background:
                rgba(0, 0, 0, 0.30);

            pointer-events: none;

            z-index: 0;
        }


        /* =====================================================
           WELCOME
        ===================================================== */

        .welcome {

            position: relative;

            z-index: 2;

            text-align: center;

            margin:
                35px auto 25px;

            max-width: 500px;

            color: #ddd;
        }


        .welcome-icon {

            font-size: 42px;

            margin-bottom: 8px;
        }


        .welcome h2 {

            margin:
                0 0 7px;

            font-size: 22px;
        }


        .welcome p {

            margin: 0;

            color: #aaa;

            font-size: 14px;

            line-height: 1.5;
        }


        /* =====================================================
           MESSAGE ROW
        ===================================================== */

        .message-row {

            position: relative;

            z-index: 1;

            display: flex;

            align-items: flex-start;

            gap: 9px;

            width: 100%;

            margin:
                13px 0;
        }


        .user-row {

            justify-content: flex-end;
        }


        /* =====================================================
           MESSAGE CONTAINER
        ===================================================== */

        .message-container {

            min-width: 0;

            max-width:
                min(75%, 700px);
        }


        .character-name {

            font-size: 12px;

            color: #ccc;

            margin-bottom: 4px;

            padding-left: 3px;
        }


        /* =====================================================
           AVATAR
        ===================================================== */

        .avatar {

            width: 44px;

            height: 44px;

            min-width: 44px;

            border-radius: 50%;

            object-fit: cover;

            background: #444;

            border:
                2px solid
                rgba(255,255,255,0.25);

            flex-shrink: 0;
        }


        .user-avatar {

            display: flex;

            justify-content: center;

            align-items: center;

            font-size: 21px;

            background: #444;
        }


        /* =====================================================
           MESSAGE BUBBLE
        ===================================================== */

        .message {

            padding:
                11px 14px;

            border-radius: 16px;

            font-size: 15px;

            line-height: 1.5;

            white-space: pre-wrap;

            overflow-wrap: anywhere;

            word-break: break-word;

            max-width: 100%;
        }


        .bot {

            background:
                rgba(38, 38, 38, 0.94);

            border-top-left-radius: 5px;

            box-shadow:
                0 2px 8px
                rgba(0,0,0,0.18);
        }


        .user {

            background:
                rgba(65, 65, 65, 0.96);

            border-top-right-radius: 5px;

            box-shadow:
                0 2px 8px
                rgba(0,0,0,0.18);
        }


        .typing {

            color: #ccc;

            font-style: italic;
        }


        /* =====================================================
           INPUT AREA
        ===================================================== */

        .input-area {

            flex: 0 0 auto;

            width: 100%;

            min-height: 68px;

            padding:
                10px 12px;

            padding-bottom:
                max(
                    10px,
                    env(safe-area-inset-bottom)
                );

            background:
                rgba(25,25,25,0.98);

            border-top:
                1px solid #333;

            display: flex;

            align-items: center;

            gap: 8px;

            z-index: 20;
        }


        #message {

            flex: 1;

            min-width: 0;

            height: 46px;

            padding:
                0 14px;

            border-radius: 13px;

            border: none;

            outline: none;

            background: white;

            color: black;

            font-size: 16px;

            appearance: none;

            -webkit-appearance: none;
        }


        #message::placeholder {

            color: #777;
        }


        .send {

            height: 46px;

            padding:
                0 17px;

            border-radius: 13px;

            border: none;

            background: white;

            color: black;

            font-weight: bold;

            font-size: 14px;

            flex-shrink: 0;

            transition:
                transform 0.15s ease,
                opacity 0.15s ease;
        }


        .send:hover {

            opacity: 0.85;
        }


        .send:active {

            transform: scale(0.96);
        }


        /* =====================================================
           OVERLAY
        ===================================================== */

        .overlay {

            display: none;

            position: fixed;

            inset: 0;

            background:
                rgba(0,0,0,0.68);

            z-index: 999;
        }


        /* =====================================================
           POPUP
        ===================================================== */

        .popup {

            display: none;

            position: fixed;

            top: 50%;

            left: 50%;

            transform:
                translate(-50%, -50%);

            width: 430px;

            max-width:
                calc(100% - 30px);

            max-height: 90vh;

            overflow-y: auto;

            background: #252525;

            padding: 22px;

            border-radius: 17px;

            box-shadow:
                0 0 30px
                rgba(0,0,0,0.7);

            z-index: 1000;
        }


        .popup h2 {

            margin:
                0 0 6px;

            font-size: 22px;
        }


        .popup-subtitle {

            margin:
                0 0 18px;

            color: #aaa;

            font-size: 13px;

            line-height: 1.4;
        }


        .popup label {

            display: block;

            margin:
                0 0 5px;

            color: #ccc;

            font-size: 12px;

            font-weight: bold;
        }


        .popup input,
        .popup textarea {

            width: 100%;

            margin-bottom: 13px;

            padding: 12px;

            border-radius: 9px;

            border: none;

            outline: none;

            font-size: 14px;

            background: white;

            color: black;

            font-family: Arial, sans-serif;
        }


        .popup textarea {

            height: 72px;

            resize: vertical;
        }


        .create-button {

            background: white;

            color: black;

            margin-right: 7px;

            border: none;

            border-radius: 9px;

            padding:
                10px 14px;

            font-weight: bold;
        }


        .cancel-button {

            background: #444;

            color: white;

            border: none;

            border-radius: 9px;

            padding:
                10px 14px;
        }


        .create-button:active,
        .cancel-button:active {

            transform: scale(0.97);
        }


        /* =====================================================
           SCROLLBAR
        ===================================================== */

        .chat::-webkit-scrollbar {

            width: 6px;
        }


        .chat::-webkit-scrollbar-thumb {

            background: #444;

            border-radius: 10px;
        }


        .popup::-webkit-scrollbar {

            width: 5px;
        }


        .popup::-webkit-scrollbar-thumb {

            background: #444;

            border-radius: 10px;
        }


        /* =====================================================
           MOBILE
        ===================================================== */

        @media (max-width: 700px) {

            .header {

                min-height: 60px;

                padding:
                    8px 9px;

                gap: 6px;
            }


            .title {

                font-size: 16px;
            }


            .title span {

                display: none;
            }


            select {

                min-width: 88px;

                max-width: 105px;

                padding:
                    8px 6px;

                font-size: 12px;
            }


            .header button {

                padding:
                    8px 7px;

                font-size: 11px;
            }


            .chat {

                padding:
                    14px 9px 90px;
            }


            .chat::before {

                top: 60px;
            }


            .welcome {

                margin-top: 25px;
            }


            .welcome h2 {

                font-size: 19px;
            }


            .welcome p {

                font-size: 13px;
            }


            .message-row {

                gap: 6px;

                margin:
                    11px 0;
            }


            .message-container {

                max-width:
                    calc(100% - 50px);
            }


            .avatar {

                width: 38px;

                height: 38px;

                min-width: 38px;
            }


            .user-avatar {

                font-size: 18px;
            }


            .message {

                font-size: 14px;

                padding:
                    9px 11px;

                border-radius: 14px;
            }


            .character-name {

                font-size: 11px;
            }


            .input-area {

                min-height: 62px;

                padding:
                    8px;

                padding-bottom:
                    max(
                        8px,
                        env(safe-area-inset-bottom)
                    );
            }


            #message {

                height: 44px;

                font-size: 16px;

                padding:
                    0 11px;
            }


            .send {

                height: 44px;

                padding:
                    0 12px;

                font-size: 13px;
            }


            .popup {

                padding: 18px;

                max-height: 85vh;
            }

        }


        /* =====================================================
           VERY SMALL PHONES
        ===================================================== */

        @media (max-width: 390px) {

            .title {

                font-size: 14px;
            }


            select {

                min-width: 76px;

                font-size: 11px;
            }


            .header button {

                font-size: 10px;

                padding:
                    7px 5px;
            }


            .avatar {

                width: 34px;

                height: 34px;

                min-width: 34px;
            }


            .message-container {

                max-width:
                    calc(100% - 43px);
            }


            .message {

                font-size: 13px;
            }


            .send {

                padding:
                    0 9px;
            }

        }

    </style>

</head>


<body>


    <!-- =====================================================
         HEADER
    ====================================================== -->

    <div class="header">

        <div class="title">

            🤖 My Character AI ✨

            <span>
                your little AI corner
            </span>

        </div>


        <select
            id="character"
            onchange="changeCharacter()"
        >

            {% for name, data in characters.items() %}

                <option value="{{ name }}">
                    {{ name }}
                </option>

            {% endfor %}

        </select>


        <button
            type="button"
            onclick="newChat()"
        >
            🆕 New
        </button>


        <button
            type="button"
            onclick="openCharacterCreator()"
        >
            ➕ Create
        </button>

    </div>


    <!-- =====================================================
         CHAT
    ====================================================== -->

    <div
        class="chat"
        id="chat"
    >

    </div>


    <!-- =====================================================
         INPUT
    ====================================================== -->

    <div class="input-area">

        <input
            type="text"
            id="message"
            placeholder="say something... 👀"
            autocomplete="off"
            enterkeyhint="send"
        >


        <button
            type="button"
            class="send"
            onclick="sendMessage()"
        >
            Send 🚀
        </button>

    </div>


    <!-- =====================================================
         OVERLAY
    ====================================================== -->

    <div
        class="overlay"
        id="overlay"
        onclick="closeCharacterCreator()"
    ></div>


    <!-- =====================================================
         CHARACTER CREATOR
    ====================================================== -->

    <div
        class="popup"
        id="characterPopup"
    >

        <h2>
            ✨ Make a character
        </h2>


        <p class="popup-subtitle">
            Give them a personality and let them cook 😭
        </p>


        <label for="newName">
            NAME
        </label>

        <input
            type="text"
            id="newName"
            placeholder="e.g. Mika"
        >


        <label for="newPersonality">
            WHAT ARE THEY LIKE?
        </label>

        <textarea
            id="newPersonality"
            placeholder="funny, kind, chaotic, confident..."
        ></textarea>


        <label for="newBackground">
            WHAT'S THEIR BACKSTORY?
        </label>

        <textarea
            id="newBackground"
            placeholder="student, adventurer, superhero..."
        ></textarea>


        <label for="newSpeakingStyle">
            HOW DO THEY TALK?
        </label>

        <textarea
            id="newSpeakingStyle"
            placeholder="casual, funny, energetic, sarcastic..."
        ></textarea>


        <label for="newImage">
            PROFILE IMAGE
        </label>

        <input
            type="text"
            id="newImage"
            placeholder="e.g. mika.jpg"
        >


        <label for="newChatBackground">
            CHAT BACKGROUND
        </label>

        <input
            type="text"
            id="newChatBackground"
            placeholder="e.g. mika_bg.jpg"
        >


        <button
            type="button"
            class="create-button"
            onclick="createCharacter()"
        >
            Create ✨
        </button>


        <button
            type="button"
            class="cancel-button"
            onclick="closeCharacterCreator()"
        >
            Never mind
        </button>

    </div>


    <!-- =====================================================
         CHARACTER DATA
    ====================================================== -->

    <script
        id="character-data"
        type="application/json"
    >
        {{ characters | tojson }}
    </script>


    <script>

        // =====================================================
        // CHARACTER DATA
        // =====================================================

        const characterData =
            JSON.parse(
                document
                    .getElementById("character-data")
                    .textContent
            );


        // =====================================================
        // GET CURRENT CHARACTER
        // =====================================================

        function getCharacter() {

            return document
                .getElementById("character")
                .value;

        }


        // =====================================================
        // GET CHARACTER IMAGE
        // =====================================================

        function getCharacterImage(character) {

            const data =
                characterData[character];


            if (
                data &&
                data.image
            ) {

                return (
                    "/static/images/" +
                    data.image
                );

            }


            return "";

        }


        // =====================================================
        // UPDATE CHAT BACKGROUND
        // =====================================================

        function updateChatBackground() {

            const character =
                getCharacter();


            const data =
                characterData[character];


            const chat =
                document.getElementById("chat");


            if (
                data &&
                data.chat_background
            ) {

                chat.style.backgroundImage =
                    "url('/static/images/" +
                    data.chat_background +
                    "')";

            }

            else {

                chat.style.backgroundImage =
                    "none";

            }

        }


        // =====================================================
        // CLEAR CHAT
        // =====================================================

        function clearChat() {

            document
                .getElementById("chat")
                .innerHTML = "";

        }


        // =====================================================
        // WELCOME MESSAGE
        // =====================================================

        function addWelcome(character) {

            const chat =
                document.getElementById("chat");


            const welcome =
                document.createElement("div");


            welcome.className =
                "welcome";


            welcome.innerHTML = `

                <div class="welcome-icon">
                    ✨
                </div>

                <h2>
                    You're chatting with ${escapeHtml(character)}
                </h2>

                <p>
                    say something... let's see what happens 👀
                </p>

            `;


            chat.appendChild(welcome);

        }


        // =====================================================
        // ESCAPE HTML
        // =====================================================

        function escapeHtml(text) {

            const div =
                document.createElement("div");

            div.textContent =
                text;

            return div.innerHTML;

        }


        // =====================================================
        // BOT MESSAGE
        // =====================================================

        function addBotMessage(
            character,
            text
        ) {

            const chat =
                document.getElementById("chat");


            const row =
                document.createElement("div");


            row.className =
                "message-row";


            const image =
                getCharacterImage(
                    character
                );


            const avatar =
                document.createElement("img");


            avatar.className =
                "avatar";


            if (image) {

                avatar.src =
                    image;

            }

            else {

                avatar.style.display =
                    "none";

            }


            avatar.onerror =
                function() {

                    this.style.display =
                        "none";

                };


            const container =
                document.createElement("div");


            container.className =
                "message-container";


            const name =
                document.createElement("div");


            name.className =
                "character-name";


            name.textContent =
                character;


            const bubble =
                document.createElement("div");


            bubble.className =
                "message bot";


            bubble.textContent =
                text;


            container.appendChild(name);

            container.appendChild(bubble);


            row.appendChild(avatar);

            row.appendChild(container);


            chat.appendChild(row);


            chat.scrollTop =
                chat.scrollHeight;

        }


        // =====================================================
        // USER MESSAGE
        // =====================================================

        function addUserMessage(text) {

            const chat =
                document.getElementById("chat");


            const row =
                document.createElement("div");


            row.className =
                "message-row user-row";


            const bubble =
                document.createElement("div");


            bubble.className =
                "message user";


            bubble.textContent =
                text;


            const avatar =
                document.createElement("div");


            avatar.className =
                "avatar user-avatar";


            avatar.textContent =
                "👤";


            row.appendChild(bubble);

            row.appendChild(avatar);


            chat.appendChild(row);


            chat.scrollTop =
                chat.scrollHeight;

        }


        // =====================================================
        // LOAD CHAT HISTORY
        // =====================================================

        async function loadChatHistory() {

            const character =
                getCharacter();


            clearChat();

            updateChatBackground();


            try {

                const response =
                    await fetch(
                        "/history/" +
                        encodeURIComponent(
                            character
                        )
                    );


                if (!response.ok) {

                    throw new Error(
                        "History could not be loaded."
                    );

                }


                const history =
                    await response.json();


                if (
                    !history ||
                    history.length === 0
                ) {

                    addWelcome(character);

                    addBotMessage(
                        character,
                        "heyy 👋 I'm " +
                        character +
                        ". what's up? 😭"
                    );

                    return;

                }


                history.forEach(
                    message => {

                        if (
                            message.role ===
                            "user"
                        ) {

                            addUserMessage(
                                message.content
                            );

                        }

                        else if (
                            message.role ===
                            "assistant"
                        ) {

                            addBotMessage(
                                character,
                                message.content
                            );

                        }

                    }
                );


            }

            catch (error) {

                console.error(
                    "History error:",
                    error
                );


                addWelcome(character);

                addBotMessage(
                    character,
                    "heyy 👋 something's up with the chat history, but I'm still here 😭"
                );

            }

        }


        // =====================================================
        // CHANGE CHARACTER
        // =====================================================

        function changeCharacter() {

            loadChatHistory();

        }


        // =====================================================
        // SEND MESSAGE
        // =====================================================

        async function sendMessage() {

            const input =
                document.getElementById(
                    "message"
                );


            const message =
                input.value.trim();


            const character =
                getCharacter();


            if (!message) {

                return;

            }


            addUserMessage(
                message
            );


            input.value = "";


            const chat =
                document.getElementById(
                    "chat"
                );


            const typing =
                document.createElement(
                    "div"
                );


            typing.className =
                "message-row";


            typing.id =
                "typing";


            const image =
                getCharacterImage(
                    character
                );


            const avatar =
                document.createElement(
                    "img"
                );


            avatar.className =
                "avatar";


            if (image) {

                avatar.src =
                    image;

            }

            else {

                avatar.style.display =
                    "none";

            }


            avatar.onerror =
                function() {

                    this.style.display =
                        "none";

                };


            const container =
                document.createElement(
                    "div"
                );


            container.className =
                "message-container";


            const name =
                document.createElement(
                    "div"
                );


            name.className =
                "character-name";


            name.textContent =
                character;


            const bubble =
                document.createElement(
                    "div"
                );


            bubble.className =
                "message bot typing";


            bubble.textContent =
                character +
                " is cooking... ⏳";


            container.appendChild(name);

            container.appendChild(bubble);


            typing.appendChild(avatar);

            typing.appendChild(container);


            chat.appendChild(typing);


            chat.scrollTop =
                chat.scrollHeight;


            try {

                const body =
                    new URLSearchParams();


                body.append(
                    "message",
                    message
                );


                body.append(
                    "character",
                    character
                );


                const response =
                    await fetch(
                        "/chat",
                        {
                            method: "POST",

                            headers: {
                                "Content-Type":
                                    "application/x-www-form-urlencoded"
                            },

                            body:
                                body.toString()
                        }
                    );


                if (!response.ok) {

                    throw new Error(
                        "Server error"
                    );

                }


                const reply =
                    await response.text();


                const typingElement =
                    document.getElementById(
                        "typing"
                    );


                if (typingElement) {

                    typingElement.remove();

                }


                addBotMessage(
                    character,
                    reply
                );

            }

            catch (error) {

                console.error(
                    "Chat error:",
                    error
                );


                const typingElement =
                    document.getElementById(
                        "typing"
                    );


                if (typingElement) {

                    typingElement.remove();

                }


                addBotMessage(
                    character,
                    "uhh... something broke 💀 try again."
                );

            }

        }


        // =====================================================
        // NEW CHAT
        // =====================================================

        async function newChat() {

            const character =
                getCharacter();


            try {

                const body =
                    new URLSearchParams();


                body.append(
                    "character",
                    character
                );


                const response =
                    await fetch(
                        "/new_chat",
                        {
                            method: "POST",

                            headers: {
                                "Content-Type":
                                    "application/x-www-form-urlencoded"
                            },

                            body:
                                body.toString()
                        }
                    );


                if (!response.ok) {

                    throw new Error(
                        "Could not start new chat."
                    );

                }


                clearChat();

                updateChatBackground();


                addWelcome(character);


                addBotMessage(
                    character,
                    "fresh chat unlocked ✨ let's gooo 😭"
                );

            }

            catch (error) {

                console.error(
                    "New chat error:",
                    error
                );


                alert(
                    "😭 Couldn't start a new chat. Try again."
                );

            }

        }


        // =====================================================
        // OPEN CHARACTER CREATOR
        // =====================================================

        function openCharacterCreator() {

            document
                .getElementById(
                    "characterPopup"
                )
                .style.display =
                "block";


            document
                .getElementById(
                    "overlay"
                )
                .style.display =
                "block";

        }


        // =====================================================
        // CLOSE CHARACTER CREATOR
        // =====================================================

        function closeCharacterCreator() {

            document
                .getElementById(
                    "characterPopup"
                )
                .style.display =
                "none";


            document
                .getElementById(
                    "overlay"
                )
                .style.display =
                "none";

        }


        // =====================================================
        // CREATE CHARACTER
        // =====================================================

        async function createCharacter() {

            const name =
                document
                    .getElementById(
                        "newName"
                    )
                    .value
                    .trim();


            const personality =
                document
                    .getElementById(
                        "newPersonality"
                    )
                    .value
                    .trim();


            const background =
                document
                    .getElementById(
                        "newBackground"
                    )
                    .value
                    .trim();


            const speakingStyle =
                document
                    .getElementById(
                        "newSpeakingStyle"
                    )
                    .value
                    .trim();


            const image =
                document
                    .getElementById(
                        "newImage"
                    )
                    .value
                    .trim();


            const chatBackground =
                document
                    .getElementById(
                        "newChatBackground"
                    )
                    .value
                    .trim();


            if (!name) {

                alert(
                    "bestie 😭 you need to give the character a name first."
                );

                return;

            }


            try {

                const body =
                    new URLSearchParams();


                body.append(
                    "name",
                    name
                );


                body.append(
                    "personality",
                    personality
                );


                body.append(
                    "background",
                    background
                );


                body.append(
                    "speaking_style",
                    speakingStyle
                );


                body.append(
                    "image",
                    image || "default.jpg"
                );


                body.append(
                    "chat_background",
                    chatBackground
                );


                const response =
                    await fetch(
                        "/create_character",
                        {
                            method: "POST",

                            headers: {
                                "Content-Type":
                                    "application/x-www-form-urlencoded"
                            },

                            body:
                                body.toString()
                        }
                    );


                const result =
                    await response.text();


                if (!response.ok) {

                    alert(
                        "😭 " + result
                    );

                    return;

                }


                alert(
                    "Character created ✨"
                );


                if (
                    result ===
                    "Character created successfully!"
                ) {

                    location.reload();

                }

            }

            catch (error) {

                console.error(
                    "Create character error:",
                    error
                );


                alert(
                    "💀 Couldn't create the character. Try again."
                );

            }

        }


        // =====================================================
        // ENTER KEY
        // =====================================================

        document
            .getElementById("message")
            .addEventListener(
                "keydown",
                function(event) {

                    if (
                        event.key ===
                        "Enter"
                    ) {

                        event.preventDefault();

                        sendMessage();

                    }

                }
            );


        // =====================================================
        // START APP
        // =====================================================

        window.addEventListener(
            "load",
            function() {

                loadChatHistory();

            }
        );

    </script>

</body>
